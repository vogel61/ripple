# RIPPLE — example configuration
#
# Everything in this file is layer A of the data model (§5.1): hand-maintained,
# persistent, never overwritten by the balancer. Live state (resolved address,
# health, residency) and measurements (tok/s) are read from the hosts or
# produced by the proxy — they are not configured here.
#
# Start:      ./.venv/bin/python -m ripple --config config.yaml
# Validate:   ./.venv/bin/python -m ripple --config config.yaml --check

listen_host: 0.0.0.0
listen_port: 8010
log_level: info
log_file: ~/Library/Logs/ripple.log     # rotating, 10 MB x 5 (NFA-8)

# Defaults for every host. A host may override any of them.
defaults:
  backend: omlx                # omlx | openai_compatible
  # A credential may be a reference into a 0600 file (issue #179), which keeps
  # this file safe to paste into a forum. `ripple init` writes exactly this:
  api_key_file: ~/.ripple/secrets.yaml#omlx.fleet
  # A literal still works — ${OMLX_API_KEY} comes from the environment:
  # api_key: ${OMLX_API_KEY}
  max_inflight: 8              # hard limit of concurrent requests (FA-5)
  max_threads: 20              # thread slots on this host (FA-19)
  spill_threshold: 3           # "full" for new threads from here on (FA-5)
  hard_threshold: 0.95         # oMLX memory.hard_threshold — admission target (FA-18)
  prefer_resident: true        # prefer hosts that already hold the model (FA-12)

# Where the nodes stand (issue #67). A site is a named location with the
# networks it contains; a host names one by id in `hosts[].site`. The claim is
# checked: the address a node is actually reached through is matched against the
# networks, and a contradiction is one line in `ripple doctor` plus a hint on the
# fleet card. A site is a location, not a routing rule — placement never reads it.
#
# The two networks below are deliberately neutral: loopback and the documentation
# range (RFC 5737, 192.0.2.0/24). Write the networks your machines really stand
# in; `ripple init` derives the local one from the interface.
sites:
  - id: local
    name: local
    networks:
      - 127.0.0.0/8
      - 192.0.2.0/24          # documentation placeholder — replace with yours

hosts:
  # One entry per oMLX node. You do not have to write this by hand:
  #   ripple discover          # prints address, node_id, model count, latency
  #   ripple init              # writes this block, config.yaml and keys.yaml
  # The two numbers a stranger cannot know are `addresses` and `node_id`; the
  # rest has defaults that work for one node and for a small fleet alike.
  - name: local                # stable identity: the key for slots and affinity
    node_id: null              # GET /api/cluster/node_id; null = resolved at
                               # start-up. A mismatch is refused, so a replaced
                               # machine cannot silently inherit a thread.
    role: entry                # entry | worker | fallback
    site: local                # a site id from the block above; says where the
                               # machine stands, never how it is reached
    weight: 1                  # target share of the traffic; 3:2 needs three hosts
    addresses:                 # probing order, one address is used at a time
      - http://127.0.0.1:8000
    models: []                 # allow-list; empty = everything the node offers
    # tg_tps / pp_tps are measured tok/s — decode and cold prefill. Leave them
    # out until you have measured them: without them RIPPLE plans with the
    # numbers it measures itself (POST /admin/nodes/<name>/calibrate).
    # warmup: []               # FA-16, optional and not implemented: RIPPLE never
                               # loads or unloads models on its own (NZ-4).
    # replication:             # a model copy to or from this host (issue #13,
                               # docs/replication.md). Only needed for that feature.
    #   address:               # ordered SSH destinations: the link you want
    #     - 192.0.2.10         # first (a bridge), the fallback after it (the LAN).
    #     - 192.0.2.11         # The first one that answers is used, and the plan
                               # says when it had to fall back (issue #67).
    #   ssh_user: your-user
    #   model_roots:           # = model.model_dirs of ~/.omlx/settings.json
    #     - ~/.omlx/models

  # A second node, for the shape of it. Two nodes is where weights and roles start
  # to matter: `entry` receives the first request of a thread, `worker` the rest.
  # - name: second
  #   role: worker
  #   weight: 1
  #   site: local
  #   addresses:
  #     - http://192.0.2.11:8000
  #   models: []

  # A cluster (issue #194): one model across two Macs. oMLX runs one deployment
  # over both machines and only the coordinator serves it; for RIPPLE that pair
  # is ONE node — one card, one model row, one capacity — so it is one host entry
  # with one address per machine. `cluster: true` needs at least two addresses
  # and a coordinator; each address names the `node_id` that machine answers
  # with, which is what makes the second Mac a member instead of an identity
  # mismatch. The capacity is the coordinator's, never the sum of both.
  # A deployment replaces the fleet while it runs, so give it its own profile and
  # its own port — docs/install.md §8 has the switch and the rollback.
  # - name: cluster
  #   cluster: true
  #   node_id: <the coordinator's node_id>   # the member that serves the model
  #   addresses:
  #     - address: http://127.0.0.1:8000     # the Mac that activates the
  #       node_id: <coordinator node_id>     # deployment
  #     - address: http://192.0.2.21:8000    # the second machine
  #       node_id: <its own node_id>
  #   models: []                             # the model the deployment runs


# Thread identity (FA-6, FA-7)
affinity:
  header: X-Session-Id         # explicit thread id; clients without it still work
  ttl_seconds: 1800            # a thread releases its slot after 30 idle minutes
  batch_ttl_seconds: 120       # …and a thread opened by a `batch` key after 2
                               # (throughput, nobody waits for its prefix cache)
  prefix_chars: 4096           # stored prefix per thread for the similarity match
  match_threshold: 0.5         # above this ratio the request belongs to the thread
  min_prompt_tokens: 8192      # shorter single-message requests hold no slot;
                               # measured on the WHOLE prompt (system, history,
                               # tool schema), not on the user text (issue #14)
  ephemeral_window_seconds: 60 # how long a short request still counts for the
                               # 3:2 split — the window starts when the request
                               # is done, so a slow one stays visible

# Binding and hysteresis (FA-2, §6.1)
placement:
  binding_strategy: deficit    # deficit | consistent_hash | least_threads
  balance_abs_threshold: 1     # must stay small for two Macs (see FA-2)
  balance_rel_threshold: 1.5   # corresponds to the 3:2 target
  thread_decay_seconds: 300    # idle threads fade out of the deficit (quadratic,
                               # 0 s = they count fully until the TTL)
  rebind:                      # move a bound thread when the gain beats the prefill
    enabled: true
    min_idle_seconds: 0        # 0 = judge on every request, not only on wake-up
    per_thread_cooldown_seconds: 600
    max_per_hour: 4            # global budget: stops a thread from paying its
                               # prefill over and over (flapping)
    safety_factor: 1.5         # gain must beat cost by this factor
    min_gain_seconds: 2.0      # below this a move is not worth the churn
    assumed_completion_tokens: 400   # when the request carries no max_tokens
    default_pp_tps: 0          # 0 = only hosts with a measured pp_tps are targets
  prefill_bias:                # charge a long prompt the extra cold prefill it
                               # would need on a slower host (deficit rule only)
    enabled: true
    slot_seconds: 60.0         # 60 s = one minute of extra prefill is worth one
                               # conversation; smaller = stricter
    max_slots: 3.0             # cap, so a 1M-token prompt cannot dominate
    min_prompt_tokens: 4096    # below this: zero bias, behaviour as before
  # A host becomes `down` only after this many consecutive SOFT probe failures
  # (timeouts). A hard failure — connection refused, identity mismatch — still
  # drops it at once, otherwise a stopped node would keep receiving requests for
  # one probe interval. 1 restores the behaviour before docs/loading-state.md.
  flap_guard_failures: 3       # 3 = 30 s at discovery.interval_seconds 10
  # The two operator stores. Both are written only by the admin endpoints (or a
  # calibration job) and read at start-up; the defaults are what the live
  # installation uses.
  maintenance_file: ~/.ripple/maintenance.yaml   # windows that take a node out
  model_policy_file: ~/.ripple/models.yaml       # (host, model) switched off:
                                                 # `disabled` (no dispatch) or
                                                 # `hidden` (gone from /v1/models)
  loading:                     # a cold load RIPPLE caused itself: probes are
                               # suspended, the host keeps its last health and
                               # stays in the pool (docs/loading-state.md)
    enabled: true
    safety_factor: 1.3         # the estimate may be too long, never too short
    max_seconds: 900           # ceiling: a hung load must not suspend probes forever
    calibration_file: ~/.ripple/calibration.yaml
    samples: 3                 # sizes per calibration run (2 or 3)

# Client authentication (FA-23). Off = every request is accepted, as before.
auth:
  enabled: true
  keys_file: ~/.ripple/keys.yaml   # YAML, mode 0600, never in the repo
  admin_key: "CHANGE-ME"           # unlocks /keys and /admin/*. `ripple init`
                                   # generates 32 hex characters; a hand-made
                                   # 4-digit key is weak by nature — LAN only,
                                   # and /keys is the only door.
  allow_loopback: false            # true = requests from 127.0.0.1 need no key
  hide_foreign_models: true        # a model outside a key's list → 404, not 403

# Replicating a model from one node to another (issue #13, docs/replication.md).
# Off by default and inert without configuration: the endpoints answer 409 and
# nothing else in RIPPLE changes. This is the only part of RIPPLE that writes to
# another machine's filesystem — operator-initiated, admin key, one model at a
# time, inside a maintenance window the job opens itself.
replication:
  enabled: false
  admin_key: ${OMLX_API_KEY}   # oMLX's own key: GET /admin/api/models, POST
                               # /admin/api/reload, PUT …/settings
  ssh_command: "ssh -o BatchMode=yes -o ConnectTimeout=8 {target}"
  rsync_command: rsync         # the copy runs `rsync -a --partial --stats` plus a
                               # progress flag that is probed, not assumed: macOS's
                               # openrsync has no --info=progress2 (it would exit 1),
                               # so `--progress` is used there and `--info=progress2`
                               # on GNU rsync. A configured command must accept `-a`,
                               # `--partial`, `--stats` and one of those two; a flag
                               # it refuses is dropped and the job still copies (#26).
  ssh_user: ""                 # default user for hosts that name none
  model_roots: []              # fallback for hosts without their own list
  free_space_factor: 1.05      # free space must be >= size × this (issue #13)
  copy_timeout_seconds: 21600  # a 453 GB copy is minutes, not hours — but bounded
  settings_exclude:            # keys the GET reports and the PUT rejects (measured)
    - display_name
    - description
    - active_profile_name
  verify_settings: true        # read back and compare; a mismatch fails the job

# Discovery and address re-resolution (FA-4, FA-21)
discovery:
  interval_seconds: 10
  timeout_seconds: 5
  unhealthy_after: 3           # consecutive failures before re-probing the address list

# Proxying (FA-8, FA-9, FA-10)
proxy:
  connect_timeout_seconds: 10  # no read timeout at all — long generations must finish
  retry_other_node: true       # retry only before the first byte, one attempt per node
  request_log: true            # one log line per request, no prompt content, no keys
  trusted_proxies: []          # peers whose X-Forwarded-For is believed (IP or CIDR,
                               # e.g. 192.0.2.0/24); empty = never. The header is
                               # written by whoever sends it, so an unlisted peer's
                               # claim about its origin never reaches the log.

# The per-host ledger (issue #33): what each node did since RIPPLE started —
# idle, loading, prefill, decode and mixed as exclusive seconds, plus requests,
# prefill/decode seconds (from oMLX's own `usage`) and the client's wait. The
# states are sampled from `GET /admin/api/activity` on every probe tick; the
# prefill/decode seconds come from the `usage` object of each answer.
stats:
  file: ~/.ripple/host_stats.json   # machine state, never in the repository
  persist: true                # false = memory only, nothing written
  flush_seconds: 30            # write interval; a reset writes at once, whatever
                               # this says. Reset: POST /admin/stats/reset (admin key)

# The start-up update check (issue #123): RIPPLE asks the public GitHub releases
# API once, in the background after the listeners are up, whether a newer release
# exists. If one does, the dashboard header shows the offer in the page's language
# plus the command to run (`ripple update` — it fetches, runs the suite and
# restarts only if the suite is green). Nothing is downloaded or installed here.
# A local build NEWER than the newest release (a GitHub checkout) is `current` and
# shows nothing: the hint never points backwards. No answer — no internet, a
# timeout, a 404 because no release exists yet — is a silent `unknown`: no warning
# in the log, no line in the header. The check runs once per start, never on a
# timer.
update:
  check: true                  # false = no request at all. For a machine without
                               # internet: otherwise every start pays a DNS lookup
                               # and a timeout for a hint that cannot arrive.
  url: https://api.github.com/repos/vogel61/ripple/releases/latest
                               # unauthenticated on purpose: a private source would
                               # need a token on every installation to show a hint.
  timeout_seconds: 3           # short: it is a hint, and it runs in the background.

# The runtime fleet (issue #70): what the operator adds or disables at the page,
# merged over `hosts` at start-up. `config.yaml` stays the hand-written baseline
# and is never written by RIPPLE — this overlay is where a click lands.
#   POST   /admin/nodes                     add (resolve, read node_id, insert)
#   DELETE /admin/nodes/{name}              drain, then remove (overlay nodes only)
#   POST   /admin/nodes/{name}/disable      drain, keep the entry, out of the pool
#   POST   /admin/nodes/{name}/enable       back into the pool
# Rule for the two sources: a node from `hosts` can be disabled, never deleted;
# a node added at the page can be deleted again. A node in both keeps the
# config's identity and takes the overlay's weight/site/enabled.
fleet:
  file: ~/.ripple/runtime.yaml # written atomically (0600), read at start-up.
                               # The old name was fleet.yaml (before #78); a
                               # runtime.yaml that does not exist yet adopts one
                               # it finds beside it, but new installs write this.
  persist: true                # false = memory only, nothing read or written
  drain_seconds: 120           # how long a removal waits for inflight == 0
  drain_poll_seconds: 0.25     # how often it looks

