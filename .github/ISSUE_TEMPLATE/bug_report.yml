name: Bug report
description: Something behaves differently than the documentation says.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. RIPPLE runs in front of hardware the maintainer
        controls, so the context below is what turns a report into something reproducible.

        **Please do not report security problems here** — see `SECURITY.md`.

  - type: input
    id: version
    attributes:
      label: Version
      description: "`ripple --version`, or the build commit in the dashboard footer."
      placeholder: "0.2.1 / build a1b2c3d"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is it running
      options:
        - launchd (deploy/install-launchd.command)
        - manual `python -m ripple`
        - container
        - other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen
      options:
        - placement / routing (wrong node, 503, migration)
        - dashboard (page, numbers, controls)
        - proxy / OpenAI-compatible API
        - residency guard / eviction
        - install, deploy, config check
        - documentation
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, in concrete terms. Numbers beat adjectives.
      placeholder: "A second thread for model X lands on the node that already runs one, although weight says 3:2."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the documentation, the config or the dashboard promised instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The smallest sequence that shows it. A request with its headers and the config excerpt is usually enough.
      placeholder: |
        1. config: weight 3 / 2, model X resident on one node only
        2. two requests with different `x-thread-id`
        3. `x-ripple-host` in the response names …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and numbers
      description: |
        The relevant lines from the ripple log and, if the dashboard is involved, the
        numbers you read there. Redact keys and addresses.
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Config excerpt
      description: The part of `config.yaml` that matters — hosts, weights, thresholds. Remove keys, tokens and real addresses.
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for the same behaviour.
          required: true
        - label: I removed API keys, tokens and private addresses from everything I pasted.
          required: true
        - label: This is not a security problem (those go through `SECURITY.md`).
          required: true
